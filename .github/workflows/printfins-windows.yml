name: E-Core Windows candidate

on:
  workflow_dispatch:
    inputs:
      auto_release:
        description: Promote and publish after all checks and the Windows build pass
        type: boolean
        default: false
      expected_sha:
        description: Exact candidate commit (required for automatic promotion)
        type: string
      integration_sha:
        description: Integration baseline captured before building
        type: string
      sync_pr:
        description: Upstream update PR; empty only for interrupted-publication recovery
        type: string
  push:
    tags:
      - 'v*-ecore.*'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ecore-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Validate pinned candidate and updater metadata
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUTO_RELEASE: ${{ inputs.auto_release }}
        run: |
          python - <<'PYCODE'
          import importlib.util, os, pathlib, subprocess
          spec = importlib.util.spec_from_file_location('promote', 'scripts/printfins/promote-release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          tag = module.validate_metadata(pathlib.Path.cwd())
          expected = os.environ.get('EXPECTED_SHA', '')
          if expected:
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          if os.environ.get('AUTO_RELEASE') == 'true':
              assert expected, 'Automatic releases require a pinned candidate SHA'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Release tag differs from compiled version'
          PYCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/printfins/check-snapshot.py
      - run: node --test tests/printfins/*.test.mjs
      - run: python -m unittest discover -s tests/printfins -p 'test_*.py' -v
      - name: Validate release metadata
        run: |
          python -m json.tool printfins-fork.json >/dev/null
          git diff --check

  build-windows:
    needs: quick-checks
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      build-deps-only: false
    secrets: inherit

  promote:
    if: inputs.auto_release == true
    needs: [quick-checks, build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.promote.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - name: Promote the exact tested candidate without bypassing repository rules
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          INTEGRATION_SHA: ${{ inputs.integration_sha }}
          SYNC_PR: ${{ inputs.sync_pr }}
        run: python scripts/printfins/promote-release.py

  publish:
    if: >-
      !cancelled() && needs.quick-checks.result == 'success' && needs.build-windows.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/') || needs.promote.result == 'success')
    needs: [quick-checks, build-windows, promote]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.promote.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: BambuStudio_Windows_*
          merge-multiple: true
          path: release
      - name: Create checksums and release manifest
        env:
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          installer="$(find release -maxdepth 1 -name '*_Setup.exe' -type f -print -quit)"
          portable="$(find release -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -n "$installer"
          test -n "$portable"
          sha256sum "$installer" "$portable" | sed 's#  release/#  #' > release/SHA256SUMS.txt
          installer_size="$(stat -c %s "$installer")"
          installer_sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          portable_size="$(stat -c %s "$portable")"
          portable_sha="$(sha256sum "$portable" | cut -d' ' -f1)"
          installer_name="$(basename "$installer")"
          portable_name="$(basename "$portable")"
          python - "$TAG" "$installer_name" "$installer_size" "$installer_sha" "$portable_name" "$portable_size" "$portable_sha" <<'PY'
          import json, pathlib, sys
          state = json.loads(pathlib.Path('printfins-fork.json').read_text(encoding='utf-8'))
          installer = {"asset": sys.argv[2], "size": int(sys.argv[3]), "sha256": sys.argv[4]}
          portable = {"asset": sys.argv[5], "size": int(sys.argv[6]), "sha256": sys.argv[7]}
          manifest = {"schema": 2, "channel": "stable", "tag": sys.argv[1],
                      "upstream_version": state["upstream_version"], "fork_revision": state["fork_revision"],
                      "asset": installer["asset"], "size": installer["size"], "sha256": installer["sha256"],
                      "installer": installer, "portable": portable,
                      "commit": "${{ github.sha }}"}
          pathlib.Path('release/latest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/printfins/publish-release.py
