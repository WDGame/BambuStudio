name: E-Core Windows candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-ecore.*'

permissions:
  contents: write

concurrency:
  group: ecore-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quick-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/printfins/check-snapshot.py
      - run: node --test tests/printfins/*.test.mjs
      - run: python -m unittest discover -s tests/printfins -p 'test_*.py' -v
      - name: Validate release metadata
        run: |
          python -m json.tool printfins-fork.json >/dev/null
          git diff --check

  build-windows:
    needs: quick-checks
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      build-deps-only: false
    secrets: inherit

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: BambuStudio_Windows_*
          merge-multiple: true
          path: release
      - name: Create checksums and release manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          installer="$(find release -maxdepth 1 -name '*_Setup.exe' -type f -print -quit)"
          portable="$(find release -maxdepth 1 -name '*.zip' -type f -print -quit)"
          test -n "$installer"
          test -n "$portable"
          sha256sum "$installer" "$portable" | sed 's#  release/#  #' > release/SHA256SUMS.txt
          installer_size="$(stat -c %s "$installer")"
          installer_sha="$(sha256sum "$installer" | cut -d' ' -f1)"
          portable_size="$(stat -c %s "$portable")"
          portable_sha="$(sha256sum "$portable" | cut -d' ' -f1)"
          installer_name="$(basename "$installer")"
          portable_name="$(basename "$portable")"
          python - "$TAG" "$installer_name" "$installer_size" "$installer_sha" "$portable_name" "$portable_size" "$portable_sha" <<'PY'
          import json, pathlib, sys
          state = json.loads(pathlib.Path('printfins-fork.json').read_text(encoding='utf-8'))
          installer = {"asset": sys.argv[2], "size": int(sys.argv[3]), "sha256": sys.argv[4]}
          portable = {"asset": sys.argv[5], "size": int(sys.argv[6]), "sha256": sys.argv[7]}
          manifest = {"schema": 2, "channel": "stable", "tag": sys.argv[1],
                      "upstream_version": state["upstream_version"], "fork_revision": state["fork_revision"],
                      "asset": installer["asset"], "size": installer["size"], "sha256": installer["sha256"],
                      "installer": installer, "portable": portable,
                      "commit": "${{ github.sha }}"}
          pathlib.Path('release/latest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --verify-tag --title "Bambu Studio E-Core ${{ github.ref_name }}" \
            --notes "Stable E-Core build based on Bambu Studio $(python -c 'import json; print(json.load(open(\"printfins-fork.json\"))[\"upstream_version\"])'). Includes PrintFins, Make overhangs printable, Russian localization, and E-Core branding."
