name: E-Core upstream sync

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ecore-upstream-sync
  cancel-in-progress: false

jobs:
  detect-and-propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: integration
          fetch-depth: 0
      - name: Integrate stable upstream and dispatch verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_RETRY: ${{ github.event_name == 'workflow_dispatch' }}
        run: python scripts/printfins/sync-upstream.py
      - name: Preserve adaptation report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: upstream-adaptation-report
          path: upstream-conflicts.txt
          if-no-files-found: ignore
