on:
  workflow_call:
    inputs:
      cache-key:
        required: true
        type: string
      cache-path:
        required: true
        type: string
      os:
        required: true
        type: string
      arch:
        required: false
        type: string

jobs:
  build_bambu:
    name: Build BambuStudio
    runs-on: ${{ inputs.os }}
    env:
      date:
      ver:
      ver_pure:

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'true'

      - name: load cached deps
        uses: actions/cache@v5
        with:
          path: ${{ inputs.cache-path }}
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Get the version and date on Ubuntu and macOS
        if: ${{ !startsWith(inputs.os, 'windows') }}
        run: |
          ver_pure=$(grep 'set(SLIC3R_VERSION' version.inc | cut -d '"' -f2)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ver="PR-${{ github.event.number }}"
          else
            ver=V$ver_pure
          fi
          echo "ver=$ver" >> $GITHUB_ENV
          echo "ver_pure=$ver_pure" >> $GITHUB_ENV
          echo "date=$(date +'%Y%m%d')" >> $GITHUB_ENV
        shell: bash

      - name: Get the version and date on Windows
        if: startsWith(inputs.os, 'windows')
        run: |
          $date = Get-Date -Format 'yyyyMMdd'
          $ref = "${{ github.ref }}"
          $eventName = "${{ github.event_name }}"
          $prNumber = "${{ github.event.number }}"

          if ($eventName -eq 'pull_request') {
              $ver = "PR" + $prNumber
          } else {
              $versionContent = Get-Content version.inc -Raw
              if ($versionContent -match 'set\(SLIC3R_VERSION "(.*?)"\)') {
                  $ver = $matches[1]
              }
              $ver = "V$ver"
          }

          echo "ver=$ver" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date=$date" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          echo "date: ${{ env.date }} version: ${{ env.ver }}"
        shell: pwsh

  #   Mac
      - name: Build slicer mac
        if: inputs.os == 'macos-15-intel'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          brew unlink cmake || true
          brew tap-new $USER/old-cmake
          brew extract --version=3.31.0 cmake $USER/old-cmake
          brew install $USER/old-cmake/cmake@3.31.0
          brew link --overwrite cmake@3.31.0
          brew pin cmake@3.31.0
          ./BuildMac.sh -s -x -a x86_64 -t 10.15 -1

      - name: Build slicer mac
        if: inputs.os == 'macos-15' || inputs.os == 'macos-26'
        working-directory: ${{ github.workspace }}
        run: |
          brew install automake texinfo
          brew unlink cmake || true
          brew tap-new $USER/old-cmake
          brew extract --version=3.31.0 cmake $USER/old-cmake
          brew install $USER/old-cmake/cmake@3.31.0
          brew link --overwrite cmake@3.31.0
          brew pin cmake@3.31.0
          ./BuildMac.sh -s -x -a universal -t 10.15 -1

      - name: pack mac app
        if: github.ref != 'refs/heads/main' && (inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26')
        working-directory: ${{ github.workspace }}
        run: zip -r BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}.zip ${{ github.workspace }}/build

      - name: Upload artifacts mac
        if: inputs.os == 'macos-15-intel' || inputs.os == 'macos-15' || inputs.os == 'macos-26'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}
          path: ${{ github.workspace }}/BambuStudio_Mac_${{inputs.arch}}_${{ env.ver }}.zip

  # Windows
      - name: setup MSVC
        if: startsWith(inputs.os, 'windows')
        uses: microsoft/setup-msbuild@v2

      - name: Install nsis and pkgconfig
        if: startsWith(inputs.os, 'windows')
        run: |
          dir "C:/Program Files (x86)/Windows Kits/10/Include"
          choco install nsis
          choco install pkgconfiglite

      - name: Select Windows SDK with 3D Repair support
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          $includeRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Include'
          $sdk = Get-ChildItem -Path $includeRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName 'winrt\windows.graphics.printing3d.h') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $sdk) {
            throw "No Windows SDK with windows.graphics.printing3d.h found under $includeRoot"
          }
          "WIN10SDK_PATH=$($sdk.FullName)" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Using Windows SDK $($sdk.Name) for Windows 3D Repair"

      - name: Build slicer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        run: |
          mkdir build
          cd build
          cmake .. -G "Visual Studio 18 2026" -A X64 -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DBBL_REQUIRE_WIN10SDK=ON -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local" -DCMAKE_INSTALL_PREFIX="../install-dir" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="$env:WIN10SDK_PATH"
          cmake --build . --target install --config Release -- -m

      - name: Run native PrintFins and overhang regression tests
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          cmake -S . -B build -DSLIC3R_BUILD_TESTS=ON
          if ($LASTEXITCODE -ne 0) { throw "Native test configuration failed" }
          cmake --build build --target printfins_integration_tests --config Release -- -m
          if ($LASTEXITCODE -ne 0) { throw "Native regression test compilation failed" }
          $env:PATH = "$env:GITHUB_WORKSPACE\install-dir;$env:GITHUB_WORKSPACE\deps\build\BambuStudio_dep\usr\local\bin;$env:PATH"
          & "$env:GITHUB_WORKSPACE\build\tests\libslic3r\Release\printfins_integration_tests.exe" '[PrintFins],[Overhang]'
          if ($LASTEXITCODE -ne 0) { throw "Native PrintFins/overhang regression tests failed" }

      - name: Verify Windows executable and 3D Repair before packaging
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "install-dir\bambu-studio.exe"
          $dll = Join-Path $env:GITHUB_WORKSPACE "install-dir\BambuStudio.dll"
          $state = Get-Content "printfins-fork.json" -Raw | ConvertFrom-Json
          if ([version](Get-Item $exe).VersionInfo.FileVersion -ne [version]$state.upstream_version) {
            throw "Windows binary version differs from the release metadata"
          }
          $bytes = [IO.File]::ReadAllBytes($dll)
          $symbols = [Text.Encoding]::ASCII.GetString($bytes) + [Text.Encoding]::Unicode.GetString($bytes)
          if (-not $symbols.Contains("Windows.Graphics.Printing3D")) {
            throw "Windows 3D Repair implementation is missing from BambuStudio.dll"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "ecore-help.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "ecore-help-errors.txt"
          $smoke = Start-Process -FilePath $exe -ArgumentList '--help' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $smoke.WaitForExit(90000)) {
            Stop-Process -Id $smoke.Id -Force
            throw "Windows command-line startup timed out"
          }
          if ($smoke.ExitCode -ne 0) {
            Get-Content $stderr
            throw "Windows command-line startup failed: $($smoke.ExitCode)"
          }
          Get-Content $stdout

      - name: Create E-Core installer Win
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $state = Get-Content "printfins-fork.json" -Raw | ConvertFrom-Json
          $installer = "BambuStudio_ECore_$($state.fork_version)_Setup.exe"
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          & $makensis "/DSOURCE_DIR=$env:GITHUB_WORKSPACE\install-dir" "/DOUTPUT_FILE=$env:GITHUB_WORKSPACE\$installer" "/DPRODUCT_VERSION=$($state.fork_version)" "/DPRODUCT_FILE_VERSION=$($state.upstream_version)" "$env:GITHUB_WORKSPACE\packaging\windows\ecore-installer.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit code $LASTEXITCODE" }
          "installer=$installer" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
      # Windows on ARM64/ARM64EC: VS 2022 generator (the arm runner has no VS
      # 2026), and the newest installed 10.* SDK is resolved at runtime rather
      # than pinned, since the arm image may not ship the exact SDK the x64 job
      # hard-codes. arm64ec produces the variant that can load the x64-only
      # Bambu network plugin in-process at native speed.
      - name: Build slicer Win ARM64/ARM64EC
        if: inputs.os == 'windows-11-arm'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $sdkRoot = "C:/Program Files (x86)/Windows Kits/10/Include"
          $sdk = (Get-ChildItem $sdkRoot -Directory | Where-Object { $_.Name -match '^10\.' } | Sort-Object Name -Descending | Select-Object -First 1).FullName
          Write-Output "Using Windows SDK: $sdk"
          $platform = "${{ inputs.arch }}" -eq "arm64ec" ? "ARM64EC" : "ARM64"
          mkdir build
          cd build
          cmake .. -G "Visual Studio 17 2022" -A $platform -DBBL_RELEASE_TO_PUBLIC=1 -DBBL_INTERNAL_TESTING=0 -DCMAKE_PREFIX_PATH="${{ github.workspace }}\deps\build\BambuStudio_dep\usr\local" -DCMAKE_INSTALL_PREFIX="../install-dir" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="$sdk"
          cmake --build . --target install --config Release -- -m


      - name: Pack app
        if: inputs.os == 'windows-latest'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip BambuStudio_Windows_${{ env.ver }}_portable.zip ${{ github.workspace }}/install-dir'

      - name: Pack app ARM64
        if: inputs.os == 'windows-11-arm'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip BambuStudio_Windows_${{ env.ver }}_${{ inputs.arch }}_portable.zip ${{ github.workspace }}/install-dir'

      # - name: Pack PDB
      #   if: inputs.os == 'windows-latest'
      #   working-directory: ${{ github.workspace }}/build/src/Release
      #   shell: cmd
      #   run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Debug_PDB_${{ env.ver }}_for_developers_only.7z  *.pdb'

      - name: Upload Windows artifacts
        if: inputs.os == 'windows-latest'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_Windows_${{ env.ver }}
          path: |
            ${{ github.workspace }}/BambuStudio_Windows_${{ env.ver }}_portable.zip
            ${{ github.workspace }}/${{ env.installer }}

      - name: Upload artifacts Win ARM64 zip
        if: inputs.os == 'windows-11-arm'
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_Windows_${{ env.ver }}_${{ inputs.arch }}_portable
          path: ${{ github.workspace }}/BambuStudio_Windows_${{ env.ver }}_${{ inputs.arch }}_portable.zip


  # Ubuntu
      - name: Install dependencies from BuildLinux.sh
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo ./BuildLinux.sh -ur

      - name: Fix permissions
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: sudo chown $USER -R ./

      - name: Build slicer
        if: inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04'
        shell: bash
        run: |
          ./BuildLinux.sh -isfr
          mv -n ./build/BambuStudio_ubu64.AppImage ./build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}.AppImage

      # - name: Build orca_custom_preset_tests
      #   if: github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04'
      #   working-directory: ${{ github.workspace }}/build/src
      #   shell: bash
      #   run: |
      #     ./OrcaSlicer_profile_validator -p ${{ github.workspace }}/resources/profiles -g 1
      #     cd ${{ github.workspace }}/resources/profiles
      #     zip -r orca_custom_preset_tests.zip user/

      - name: Upload artifacts Ubuntu
        if: ${{ ! env.ACT && (inputs.os == 'ubuntu-22.04' || inputs.os == 'ubuntu-24.04' || inputs.os == 'ubuntu-26.04') }}
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio_${{inputs.os}}_${{ env.ver }}
          path: './build/Bambu_Studio_${{inputs.os}}_${{ env.ver }}.AppImage'

      # - name: Deploy Ubuntu release
      #   if: ${{ ! env.ACT && github.ref == 'refs/heads/main' && inputs.os == 'ubuntu-22.04' }}
      #   uses: WebFreak001/deploy-nightly@v3.2.0
      #   with:
      #     upload_url: https://uploads.github.com/repos/SoftFever/OrcaSlicer/releases/137995723/assets{?name,label}
      #     release_id: 137995723
      #     asset_path: ./build/OrcaSlicer_Linux_${{ env.ver }}.AppImage
      #     asset_name: OrcaSlicer_Linux_${{ env.ver }}.AppImage
